<!DOCTYPE html>
<html>

<head>

<title>Quick Admit</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
margin:0;
background:#eef4ff;
overflow-x:hidden;
transition:0.3s;
color:black;
}

body.dark{
background:#111827;
color:white;
}

/* HEADER */

header{
background:#2563eb;
color:white;
padding:20px;
text-align:center;
}

/* TOP BAR */

.top-bar{
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
padding:20px;
}

/* INPUTS */

input,
select{
padding:12px;
border-radius:10px;
border:1px solid #ccc;
width:100%;
box-sizing:border-box;
}

/* BUTTONS */

button{
padding:12px 18px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
cursor:pointer;
font-weight:bold;
}

.red{
background:red;
}

.green{
background:green;
}

/* HOSPITAL GRID */

#hospitalList{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(350px,1fr));
gap:20px;
padding:20px;
}

/* CARD */

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:
0 4px 15px rgba(0,0,0,0.1);
transition:0.3s;
}

body.dark .card{
background:#1f2937;
color:white;
}

/* IMAGE */

.card img{
width:100%;
height:220px;
object-fit:cover;
}

/* CONTENT */

.content{
padding:20px;
}

/* BED BOX */

.bed-box{
background:#f3f7ff;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

body.dark .bed-box{
background:#374151;
}

/* MODALS */

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
rgba(0,0,0,0.5);
display:none;
justify-content:center;
align-items:center;
z-index:999;
padding:20px;
box-sizing:border-box;
}

.modal-content{
background:white;
padding:25px;
border-radius:20px;
width:100%;
max-width:500px;
max-height:90vh;
overflow-y:auto;
}

body.dark .modal-content{
background:#1f2937;
color:white;
}

/* MODAL TOP */

.modal-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

/* BOOKING CARD */

.booking-card{
background:#f3f7ff;
padding:15px;
border-radius:15px;
margin-bottom:15px;
}

body.dark .booking-card{
background:#374151;
}

/* CHATBOT */

#chatBtn{
position:fixed;
right:20px;
bottom:20px;
z-index:999;
}

#chatbot{
position:fixed;
right:20px;
bottom:80px;
width:320px;
background:white;
border-radius:20px;
overflow:hidden;
display:none;
box-shadow:
0 4px 15px rgba(0,0,0,0.2);
z-index:999;
}

body.dark #chatbot{
background:#1f2937;
color:white;
}

#chatHeader{
background:#2563eb;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

#chatMessages{
height:250px;
overflow-y:auto;
padding:15px;
}

</style>

</head>

<body>

<header>

<h1>🏥 Quick Admit</h1>

<p>
Smart Hospital Management System
</p>

</header>

<div class="top-bar">

<input
id="citySearch"
placeholder="Search City">

<select id="hospitalCategory">

<option value="all">
All Hospitals
</option>

<option value="government">
Government
</option>

<option value="private">
Private
</option>

</select>

<button onclick="searchHospital()">
🔍 Search
</button>

<button onclick="openBookings()">
📖 My Bookings
</button>

<button onclick="openAppointments()">
📅 My Appointments
</button>

<button onclick="openAmbulance()">
🚑 Ambulance
</button>

<button onclick="toggleDarkMode()">
🌙 Dark Mode
</button>

<button onclick="logout()">
🚪 Logout
</button>

</div>

<div id="hospitalList"></div>

<!-- BOOKING MODAL -->

<div class="modal" id="bookingModal">

<div class="modal-content">

<div class="modal-top">

<h2>Book Bed</h2>

<button
class="red"
onclick="closeBookingModal()">

✖

</button>

</div>

<input
id="patientName"
placeholder="Patient Name">

<br><br>

<input
id="patientAge"
placeholder="Patient Age">

<br><br>

<select id="paymentMode">

<option>
Cash
</option>

<option>
UPI
</option>

<option>
Card
</option>

</select>

<br><br>

<button onclick="confirmBooking()">
Confirm Booking
</button>

</div>

</div>

<!-- BOOKINGS -->

<div class="modal" id="bookingsModal">

<div class="modal-content">

<div class="modal-top">

<h2>My Bookings</h2>

<button
class="red"
onclick="closeBookings()">

✖

</button>

</div>

<div id="bookingCards"></div>

</div>

</div>

<!-- APPOINTMENT -->

<div class="modal" id="appointmentModal">

<div class="modal-content">

<div class="modal-top">

<h2>Book Appointment</h2>

<button
class="red"
onclick="closeAppointment()">

✖

</button>

</div>

<input
id="doctorName"
placeholder="Doctor Name">

<br><br>

<input
id="appointPatient"
placeholder="Patient Name">

<br><br>

<input
id="appointAge"
placeholder="Patient Age">

<br><br>

<input
id="appointDate"
placeholder="Appointment Date">

<br><br>

<button onclick="confirmAppointment()">
Confirm Appointment
</button>

</div>

</div>

<!-- AMBULANCE -->

<div class="modal" id="ambulanceModal">

<div class="modal-content">

<div class="modal-top">

<h2>Call Ambulance</h2>

<button
class="red"
onclick="closeAmbulance()">

✖

</button>

</div>

<input
id="ambulanceName"
placeholder="Your Name">

<br><br>

<input
id="ambulancePhone"
placeholder="Phone Number">

<br><br>

<input
id="ambulanceHospital"
placeholder="Hospital">

<br><br>

<input
id="ambulanceLocation"
placeholder="Location">

<br><br>

<button onclick="confirmAmbulance()">
Call Ambulance
</button>

<br><br>

<div id="ambulanceResult"></div>

</div>

</div>

<!-- CHATBOT -->

<button id="chatBtn"
onclick="toggleChatbot()">

🤖 AI

</button>

<div id="chatbot">

<div id="chatHeader">

<span>
AI Assistant
</span>

<button
class="red"
onclick="toggleChatbot()">

✖

</button>

</div>

<div id="chatMessages">

<p>
Hello 👋
How can I help you?
</p>

</div>

<div style="padding:10px;">

<input
id="chatInput"
placeholder="Type message">

<br><br>

<button onclick="sendMessage()">
Send
</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
