
<!DOCTYPE html>
<html>

<head>

<title>QuickAdmit Login</title>

<link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

<div class="login-container">

<div class="login-left">

<h1>QuickAdmit</h1>

<p>
Smart Hospital Bed Booking System
</p>

<img
src="https://images.unsplash.com/photo-1586773860418-d37222d8fce3"
class="login-image">

</div>

<div class="login-card">

<h2>Login</h2>

<p class="sub-text">
Login to continue
</p>

<input
type="email"
id="email"
placeholder="Enter Email">

<input
type="password"
id="password"
placeholder="Enter Password">

<button onclick="loginUser()">
Login
</button>

<p>

New User?

<a href="signup.html">
Create Account
</a>

</p>

</div>

</div>

<script src="script.js"></script>


</body>

</html>
