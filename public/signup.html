<!DOCTYPE html>
<html>

<head>

<title>QuickAdmit Signup</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(135deg,#2563eb,#60a5fa);
overflow:hidden;
}

.container{
width:950px;
height:600px;
background:white;
border-radius:30px;
overflow:hidden;
display:flex;
box-shadow:
0 10px 40px rgba(0,0,0,0.25);
}

.left{
flex:1;
background:
linear-gradient(
rgba(37,99,235,0.85),
rgba(37,99,235,0.85)
),
url("https://images.unsplash.com/photo-1516549655169-df83a0774514?q=80&w=1200&auto=format&fit=crop");

background-size:cover;
background-position:center;

color:white;

display:flex;
flex-direction:column;
justify-content:center;
padding:50px;
}

.logo{
font-size:70px;
margin-bottom:20px;
}

.left h1{
font-size:55px;
margin-bottom:15px;
}

.left p{
font-size:18px;
line-height:1.7;
opacity:0.95;
}

.right{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
}

.form-box{
width:100%;
max-width:330px;
}

.form-box h2{
font-size:35px;
margin-bottom:10px;
color:#2563eb;
}

.form-box p{
color:gray;
margin-bottom:30px;
}

input{
width:100%;
padding:14px;
margin-bottom:18px;
border-radius:12px;
border:1px solid #ccc;
font-size:15px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#1d4ed8;
}

.bottom{
margin-top:20px;
text-align:center;
}

.bottom a{
text-decoration:none;
color:#2563eb;
font-weight:bold;
}

@media(max-width:850px){

.container{
flex-direction:column;
height:auto;
width:95%;
}

.left{
padding:30px;
}

.left h1{
font-size:40px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<div class="logo">
🏥
</div>

<h1>
QuickAdmit
</h1>

<p>

Create your healthcare account and get instant access to:

<br><br>

✔ Hospital Bed Booking  
✔ Emergency Ambulance  
✔ Doctor Appointments  
✔ AI Healthcare Assistant  

<br>

Safe • Smart • Fast

</p>

</div>

<div class="right">

<div class="form-box">

<h2>
Create Account
</h2>

<p>
Join QuickAdmit Healthcare System
</p>

<input
type="text"
id="name"
placeholder="Enter Name">

<input
type="email"
id="email"
placeholder="Enter Email">

<input
type="text"
id="phone"
placeholder="Enter Phone Number">

<input
type="password"
id="password"
placeholder="Enter Password">

<button onclick="signup()">
Create Account
</button>

<div class="bottom">

Already have account?

<a href="login.html">
Login
</a>

</div>

</div>

</div>

</div>

<script>

async function signup(){

const name=
document.getElementById("name").value;

const email=
document.getElementById("email").value;

const phone=
document.getElementById("phone").value;

const password=
document.getElementById("password").value;

if(!name || !email || !phone || !password){

alert("Fill all fields");
return;
}

const response=
await fetch("/api/signup",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
name,
email,
phone,
password
})

});

const data=
await response.json();

if(data.success){

alert("Signup Successful");

window.location.href=
"login.html";

}

else{

alert(data.message);

}
}

</script>

</body>
</html>
